name: translate

on:
  repository_dispatch:
    types: [translate]
  workflow_dispatch:
    inputs:
      engine:
        description: Translation engine
        type: choice
        options: [tgemma, opus, m2m100, m2m100-big, madlad]
        default: tgemma
      limit:
        description: Jobs fetched per round
        default: "25"
      max_minutes:
        description: Minutes the worker may run before it stops taking jobs (use a large value for one long backfill run)
        default: "20"
      selftest:
        description: Run the built-in selftest (no site needed)
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: translate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      YK_ENGINE: ${{ github.event.inputs.engine || 'tgemma' }}
      YK_PURGE_HF_CACHE: "1"
      OLLAMA_MODELS: ${{ github.workspace }}/ollama-models
      YK_LIMIT: ${{ github.event.inputs.limit || '25' }}
      YK_MODEL_DIR: ${{ github.workspace }}/models
      SELFTEST: ${{ github.event.inputs.selftest || 'false' }}
    steps:
      - name: Check for pending jobs
        id: check
        env:
          YK_SITE_URL: ${{ secrets.YK_SITE_URL }}
          YK_WORKER_TOKEN: ${{ secrets.YK_WORKER_TOKEN }}
        run: |
          if [ "$SELFTEST" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          body=$(curl -fsS --retry 3 --max-time 30 \
            -H "X-YK-Token: $YK_WORKER_TOKEN" \
            "$YK_SITE_URL/wp-json/yk-translate/v1/pending?count_only=1")
          # curl -f above still fails the run on 403/503 (wanted). Only a 200 with a non-JSON body is tolerated here.
          if ! n=$(printf '%s' "$body" | jq -er '.pending // 0' 2>/dev/null); then
            echo "::warning::the site answered with something that is not JSON (${#body} characters); nothing to do this run"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "pending jobs: $n"
          if [ "$n" = "0" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true' && env.YK_ENGINE != 'tgemma'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true' && env.YK_ENGINE == 'tgemma'
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        id: models
        if: steps.check.outputs.run == 'true' && env.YK_ENGINE != 'tgemma'
        with:
          path: models
          key: models-${{ env.YK_ENGINE }}-v1

      - uses: actions/cache@v4
        if: steps.check.outputs.run == 'true' && env.YK_ENGINE == 'tgemma'
        with:
          path: ollama-models
          key: ollama-translategemma-4b-v1

      - name: Install requirements
        if: steps.check.outputs.run == 'true' && env.YK_ENGINE != 'tgemma'
        run: pip install -r requirements.txt

      - name: Install requests only (tgemma needs no model libraries)
        if: steps.check.outputs.run == 'true' && env.YK_ENGINE == 'tgemma'
        run: pip install requests==2.32.3

      # madlad: converting the 11.8 GB float32 model needs more than the 16 GB of RAM, so add swap
      # and keep the Hugging Face download on /mnt (the runner's / has only about 14 GB free).
      - name: Prepare memory and disk for the madlad conversion
        if: steps.check.outputs.run == 'true' && env.YK_ENGINE == 'madlad' && steps.models.outputs.cache-hit != 'true'
        run: |
          df -h / /mnt
          free -h
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo mkdir -p /mnt/hf
          sudo chown "$(id -u):$(id -g)" /mnt/hf
          echo "HF_HOME=/mnt/hf" >> "$GITHUB_ENV"
          free -h
          df -h / /mnt

      - name: Install and start Ollama
        if: steps.check.outputs.run == 'true' && env.YK_ENGINE == 'tgemma'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # the installer may start its own systemd service (models under /usr/share/ollama):
          # stop it so that our server, started below with OLLAMA_MODELS, owns port 11434
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          setsid nohup ollama serve > ollama.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags > /dev/null || { cat ollama.log; exit 1; }
          ollama --version
          ollama pull translategemma:4b
          ollama list
          df -h /

      - name: Selftest
        if: steps.check.outputs.run == 'true' && env.SELFTEST == 'true'
        env:
          YK_DEBUG: "1"
        run: python translate_worker.py --selftest

      - name: Translate pending jobs
        if: steps.check.outputs.run == 'true' && env.SELFTEST != 'true'
        env:
          YK_SITE_URL: ${{ secrets.YK_SITE_URL }}
          YK_WORKER_TOKEN: ${{ secrets.YK_WORKER_TOKEN }}
          YK_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '20' }}
        run: python translate_worker.py
